<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <title>Notes Library - Padhai Nepal Academy</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand"><a href="index.html" class="text-white">Padhai Nepal</a></div>
    </div>
  </nav>

  <main class="container section">
    <h1>📖 Notes Library</h1>
    <input type="text" class="form-control mb-4" placeholder="Search notes (Nepali/English)...">
    
    <div class="grid grid-3">
      <div class="card">
        <h4>नेपालको इतिहास</h4>
        <span class="badge badge-pyq">Lok Sewa</span>
        <p class="mt-3">A complete guide to history of Nepal for competitive exams.</p>
        <button class="btn btn-outline mt-3">Read</button>
      </div>
      <div class="card">
        <h4>Science - Force</h4>
        <span class="badge badge-pyq">SEE</span>
        <p class="mt-3">Chapter 1 notes with important formulas.</p>
        <button class="btn btn-outline mt-3">Read</button>
      </div>
      <div class="card">
        <h4>First Paper GK</h4>
        <span class="badge badge-pyq">Teacher Service</span>
        <p class="mt-3">Essential GK for TSC first paper.</p>
        <button class="btn btn-outline mt-3">Read</button>
      </div>
    </div>
  </main>
</body>
</html>
