<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <title>Chess Arena - Padhai Nepal Academy</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .chess-board {
      display: grid;
      grid-template-columns: repeat(8, 40px);
      grid-template-rows: repeat(8, 40px);
      width: 320px;
      margin: 20px auto;
      border: 4px solid var(--color-navy);
    }
    .chess-board div { width: 100%; height: 100%; }
    .white { background: #eee; }
    .black { background: var(--color-navy); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand"><a href="index.html" class="text-white">Padhai Nepal</a></div>
    </div>
  </nav>

  <main class="container section text-center">
    <h1>♟️ Chess Arena</h1>
    <p>Refresh your mind. Improve your strategy.</p>
    
    <div class="chess-board">
      <!-- Row 1 -->
      <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div>
      <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div>
      <!-- Repeat for visual mockup -->
      <div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
      <div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
      <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div>
      <div class="white"></div><div class="black"></div><div class="white"></div><div class="black"></div>
      <div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
      <div class="black"></div><div class="white"></div><div class="black"></div><div class="white"></div>
      <!-- Simplified, not all 64 needed for a quick mockup just to show visual -->
    </div>

    <div class="mt-4">
      <button class="btn btn-primary">Play vs AI</button>
      <button class="btn btn-secondary">Play with Friend</button>
    </div>
    
    <div class="mt-4">
      <h3>Tournament <span class="badge badge-coming">Coming Soon</span></h3>
    </div>
  </main>
</body>
</html>
